<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VirtualLVPN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #0a0a0a;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 400px;
        }
        h1 {
            color: #9d4edd;
            font-size: 42px;
            margin-bottom: 20px;
        }
        .telegram-btn {
            background: #0088cc;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
            font-weight: bold;
            font-size: 18px;
        }
        .info {
            background: rgba(157, 78, 221, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #9d4edd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 VirtualLVPN</h1>
        
        <div class="info">
            <p>Это мини-приложение работает только в Telegram!</p>
        </div>
        
        <p>Откройте через нашего бота:</p>
        
        <a href="https://t.me/VirtualLVPN_bot" class="telegram-btn">
            📲 Открыть в Telegram
        </a>
        
        <p style="margin-top: 30px; color: #888; font-size: 14px;">
            После открытия в Telegram:<br>
            1. Нажмите "START" в боте<br>
            2. Нажмите кнопку "🌌 Открыть мини-приложение"<br>
            3. Наслаждайтесь красивым интерфейсом!
        </p>
    </div>
</body>
</html>
